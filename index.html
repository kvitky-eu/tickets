    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-image: url('bg.jpg'); 
            background-size: contain; 
            background-position: center top; 
            background-repeat: repeat; 
            background-attachment: fixed; 
            background-color: #0f2b5c; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-card {
            background: rgba(22, 58, 117, 0.94); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 2px solid rgba(35, 82, 155, 0.6);
            text-align: center;
        }
        
        .search-form {
            background: rgba(13, 36, 77, 0.85);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px solid #1e4b91;
            text-align: left;
        }
        .form-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #ffd43b;
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 0.9rem;
            color: #a0b2cb;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #23529b;
            background-color: #163a75;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #ffd43b;
        }
    </style>
</head>
<body>

<div class="main-card">
    
    <div class="search-form">
        <div class="form-title">Швидкий підбір рейсу</div>
        
        <div class="input-group">
            <label for="textFrom">Місто відправлення (Україна):</label>
            <input type="text" id="textFrom" placeholder="Наприклад: Київ, Львів" oninput="updateLinks()">
        </div>
        
        <div class="input-group">
            <label for="textTo">Місто прибуття (Європа):</label>
            <input type="text" id="textTo" placeholder="Наприклад: Варшава, Берлін" oninput="updateLinks()">
        </div>
        
        <div class="input-group">
            <label for="textDate">Дата поїздки:</label>
            <input type="text" id="textDate" placeholder="Оберіть або введіть дату" onfocus="(this.type='date')" onblur="(this.value ? this.type='date' : this.type='text')" onchange="updateLinks()">
        </div>

        <div class="input-group">
            <label for="textPhone">Ваш номер телефону:</label>
            <input type="tel" id="textPhone" placeholder="+380" value="+380" oninput="updateLinks()">
        </div>
    </div>

    <!-- Варіанти відправки даних -->
    <div class="cta-title">Надіслати заповнені дані в месенджер:</div>
    
    <a href="https://t.me" id="tgPersonalBtn" target="_blank" class="btn btn-tg">
        <i class="fa-brands fa-telegram" style="font-size: 1.3rem;"></i>
        <span>Надіслати в особистий Telegram</span>
    </a>

    <a href="viber://chat?number=%2B380995674703" id="viberPersonalBtn" class="btn btn-viber">
        <i class="fa-brands fa-viber" style="font-size: 1.3rem;"></i>
        <span>Надіслати в особистий Viber</span>
    </a>

    <a href="tel:+380995674703" class="btn btn-phone">
        <i class="fa-solid fa-phone"></i>
        <span>Зателефонувати: 099 567 47 03</span>
    </a>

    <div class="footer">
        Бронювання безкоштовне • Оплата при посадці
    </div>
</div>

<script>
    function updateLinks() {
        var fromCity = document.getElementById('textFrom').value.trim() || '...';
        var toCity = document.getElementById('textTo').value.trim() || '...';
        var rawDate = document.getElementById('textDate').value || '...';
        var clientPhone = document.getElementById('textPhone').value.trim() || '+380';

        var cleanDate = rawDate;
        if (rawDate.indexOf('-') !== -1) {
            var parts = rawDate.split('-');
            if (parts.length === 3) {
                cleanDate = parts[2] + '.' + parts[1] + '.' + parts[0];
            }
        }

        var tgMessage = "Вітаю! Бажаю залишити заявку на підбір рейсу:\n• Звідки: " + fromCity + "\n• Куди: " + toCity + "\n• Дата: " + cleanDate + "\n• Мій телефон: " + clientPhone;
        var viberMessage = "Рейс: " + fromCity + " - " + toCity + ". Дата: " + cleanDate + ". Тел: " + clientPhone;

        document.getElementById('tgPersonalBtn').href = 'https://t.me?text=' + encodeURIComponent(tgMessage);
        document.getElementById('viberPersonalBtn').href = 'viber://chat?number=%2B380995674703&draft=' + encodeURIComponent(viberMessage);
    }
    updateLinks();
</script>

</body>
