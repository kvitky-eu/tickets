<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квитки на автобус з України до Європи</title>
    <!-- Підключаємо сучасні іконки Font Awesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            /* Змінюємо налаштування, щоб картинка була зжатою до оригінальних пропорцій */
            background-image: url('bg.jpg'); 
            background-size: contain; /* Стискає картинку, показуючи її повністю без розтягування */
            background-position: center top; /* Вирівнюємо по центру вгорі */
            background-repeat: repeat; /* Повторює фон, якщо екран більший за малюнок */
            background-attachment: fixed; /* Фон залишається нерухомим */
            background-color: #0f2b5c; /* Основний колір фону сайту */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Напівпрозорий блок-контейнер поверх фону */
        .main-card {
            background: rgba(22, 58, 117, 0.94); /* Трохи щільніший колір для ідеального читання тексту */
            backdrop-filter: blur(10px); /* Гарне розмиття фону за карткою */
            -webkit-backdrop-filter: blur(10px);
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 2px solid rgba(35, 82, 155, 0.6);
            text-align: center;
        }
        
        /* Стилі форми пошуку */
        .search-form {
            background: rgba(13, 36, 77, 0.85);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px solid #1e4b91;
            text-align: left;
        }
        .form-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #ffd43b;
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group:last-of-type {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 0.9rem;
            color: #a0b2cb;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #23529b;
            background-color: #163a75;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .input-group input:focus {
            border-color: #ffd43b;
        }
        .btn-submit {
            background: linear-gradient(135deg, #ffd43b, #e5be2b);
            color: #0f2b5c;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-submit:active {
            transform: scale(0.98);
        }

        /* Кнопки месенджерів */
        .cta-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: 600;
            color: #ffffff;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: bold;
            color: white;
            transition: transform 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-tg {
            background: linear-gradient(135deg, #26a5e4, #1d8fd1);
            box-shadow: 0 4px 15px rgba(38, 165, 228, 0.2);
        }
        .btn-viber {
            background: linear-gradient(135deg, #7360f2, #5945d6);
            box-shadow: 0 4px 15px rgba(115, 96, 242, 0.2);
        }
        .btn-phone {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.2);
            margin-bottom: 0;
        }
        
        .footer {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #a0b2cb;
        }
    </style>
</head>
<body>

<!-- Картка з формою та кнопками поверх стиснутого фону -->
<div class="main-card">
    
    <!-- Форма підбору квитків -->
    <form class="search-form" id="busSearchForm">
        <div class="form-title">Швидкий підбір рейсу</div>
        
        <div class="input-group">
            <label for="from">Місто відправлення (Україна):</label>
            <input type="text" id="from" placeholder="Наприклад: Київ, Львів" required>
        </div>
        
        <div class="input-group">
            <label for="to">Місто прибуття (Європа):</label>
            <input type="text" id="to" placeholder="Наприклад: Варшава, Берлін" required>
        </div>
        
        <div class="input-group">
            <label for="date">Дата поїздки:</label>
            <input type="date" id="date" required>
        </div>
        
        <button type="submit" class="btn-submit">
            <span>Залишити заявку в чат</span>
            <i class="fa-solid fa-arrow-right"></i>
        </button>
    </form>

    <!-- Блок швидкого зв'язку -->
    <div class="cta-title">Або забронюйте напряму через месенджери:</div>
    
    <a href="https://t.me" target="_blank" class="btn btn-tg">
        <i class="fa-brands fa-telegram" style="font-size: 1.3rem;"></i>
        <span>Написати в Telegram</span>
    </a>

    <a href="viber://chat?number=%2B380995674703" class="btn btn-viber">
        <i class="fa-brands fa-viber" style="font-size: 1.3rem;"></i>
        <span>Написати в Viber</span>
    </a>

    <a href="tel:+380995674703" class="btn btn-phone">
        <i class="fa-solid fa-phone"></i>
        <span>Зателефонувати: 099 567 47 03</span>
    </a>

    <div class="footer">
        Бронювання безкоштовне • Оплата при посадці
    </div>
</div>

<!-- Скрипт обробки форми -->
<script>
    document.getElementById('busSearchForm').addEventListener('submit', function(event) {
        event.preventDefault();
        
        const fromCity = document.getElementById('from').value;
        const toCity = document.getElementById('to').value;
        const travelDate = document.getElementById('date').value;
        
        const dateObj = new Date(travelDate);
        const formattedDate = dateObj.toLocaleDateString('uk-UA');
        
        const textMessage = `Вітаю! Бажаю залишити заявку на підбір рейсу:\n• Звідки: ${fromCity}\n• Куди: ${toCity}\n• Дата: ${formattedDate}`;
        const encodedText = encodeURIComponent(textMessage);
        
        window.location.href = `viber://chat?number=%2B380995674703&draft=${encodedText}`;
    });
</script>

</body>
</html>
