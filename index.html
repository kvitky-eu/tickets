<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квитки на автобус з України до Європи</title>
    <!-- Підключення Font Awesome через офіційний CDN cdnjs -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-image: url('bg.jpg'); 
            background-size: contain; 
            background-position: center top; 
            background-repeat: repeat; 
            background-attachment: fixed; 
            background-color: #0f2b5c; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Напівпрозорий блок-контейнер поверх фону */
        .main-card {
            background: rgba(22, 58, 117, 0.94); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 2px solid rgba(35, 82, 155, 0.6);
            text-align: center;
        }
        
        /* Стилі форми пошуку */
        .search-form {
            background: rgba(13, 36, 77, 0.85);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px solid #1e4b91;
            text-align: left;
        }
        .form-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #ffd43b;
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group:last-of-type {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 0.9rem;
            color: #a0b2cb;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #23529b;
            background-color: #163a75;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .input-group input:focus {
            border-color: #ffd43b;
        }
        .btn-submit {
            background: linear-gradient(135deg, #ffd43b, #e5be2b);
            color: #0f2b5c;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-submit:active {
            transform: scale(0.98);
        }

        /* Кнопки месенджерів */
        .cta-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: 600;
            color: #ffffff;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: bold;
            color: white;
            transition: transform 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-tg {
            background: linear-gradient(135deg, #26a5e4, #1d8fd1);
            box-shadow: 0 4px 15px rgba(38, 165, 228, 0.2);
        }
        .btn-viber {
            background: linear-gradient(135deg, #7360f2, #5945d6);
            box-shadow: 0 4px 15px rgba(115, 96, 242, 0.2);
        }
        .btn-phone {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.2);
            margin-bottom: 0;
        }
        
        .footer {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #a0b2cb;
        }
    </style>
</head>
<body>

<div class="main-card">
    
    <!-- Форма підбору квитків -->
    <form class="search-form" id="tgBusForm">
        <div class="form-title">Швидкий підбір рейсу</div>
        
        <div class="input-group">
            <label for="from">Місто відправлення (Україна):</label>
            <input type="text" id="from" placeholder="Наприклад: Київ, Львів" list="ukraine-cities" required>
            <datalist id="ukraine-cities">
                <option value="Київ">
                <option value="Львів">
                <option value="Одеса">
                <option value="Дніпро">
                <option value="Харків">
                <option value="Запоріжжя">
                <option value="Івано-Франківськ">
                <option value="Тернопіль">
                <option value="Чернівці">
                <option value="Вінниця">
                <option value="Луцьк">
                <option value="Рівне">
                <option value="Житомир">
                <option value="Полтава">
                <option value="Хмельницький">
            </datalist>
        </div>
        
        <div class="input-group">
            <label for="to">Місто прибуття (Європа):</label>
            <input type="text" id="to" placeholder="Наприклад: Варшава, Берлін" list="europe-cities" required>
            <datalist id="europe-cities">
                <option value="Варшава (Польща)">
                <option value="Краків (Польща)">
                <option value="Вроцлав (Польща)">
                <option value="Берлін (Німеччина)">
                <option value="Мюнхен (Німеччина)">
                <option value="Прага (Чехія)">
                <option value="Брно (Чехія)">
                <option value="Будапешт (Угорщина)">
                <option value="Відень (Австрія)">
                <option value="Братислава (Словаччина)">
                <option value="Вільнюс (Литва)">
                <option value="Рига (Латвія)">
                <option value="Париж (Франція)">
                <option value="Рим (Італія)">
            </datalist>
        </div>
        
        <div class="input-group">
            <label for="date">Дата поїздки:</label>
            <input type="date" id="date" required>
        </div>

        <!-- Поле телефону клієнта -->
        <div class="input-group">
            <label for="phone">Ваш номер телефону:</label>
            <input type="tel" id="phone" placeholder="+380" value="+380" required>
        </div>
        
        <button type="submit" class="btn-submit">
            <span>Надіслати заявку</span>
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </form>

    <!-- Блок швидкого зв'язку -->
    <div class="cta-title">Або забронюйте напряму через месенджери:</div>
    
    <a href="https://t.me" target="_blank" class="btn btn-tg">
        <i class="fa-brands fa-telegram" style="font-size: 1.3rem;"></i>
        <span>Написати в Telegram</span>
    </a>

    <a href="viber://chat?number=%2B380995674703" target="_blank" class="btn btn-viber">
        <i class="fa-brands fa-viber" style="font-size: 1.3rem;"></i>
        <span>Написати в Viber</span>
    </a>

    <a href="tel:+380995674703" class="btn btn-phone">
        <i class="fa-solid fa-phone"></i>
        <span>Зателевонувати: 099 567 47 03</span>
    </a>

    <div class="footer">
        Бронювання безкоштовне • Оплата при посадці
    </div>
</div>

<script>
    document.getElementById('tgBusForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // Ваші точні налаштування Telegram
        const TELEGRAM_TOKEN = '9262418807:AAElDN9TRORbpEQrGzZO-I4lwhU-QQ4DiLs';
        const TELEGRAM_CHAT_ID = '8172069744';

        const from = document.getElementById('from').value;
        const to = document.getElementById('to').value;
        const date = document.getElementById('date').value;
        const phone = document.getElementById('phone').value;

        const dateObj = new Date(date);
        const formattedDate = dateObj.toLocaleDateString('uk-UA');

        const messageText = `🔔 Нова заявка на рейс:\n📌 Звідки: ${from}\n📍 Куди: ${to}\n📅 Дата: ${formattedDate}\n📞 ... Телефон: ${phone}`;

        const url = `https://telegram.org{TELEGRAM_TOKEN}/sendMessage`;

        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: messageText
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.ok) {
                alert('Дякуємо! Заявку успішно надіслано.');
                document.getElementById('tgBusForm').reset();
                document.getElementById('phone').value = '+380';
            } else {
                alert('Помилка Telegram: ' + data.description);
            }
        })
        .catch(error => {
            alert('Помилка з\'єднання. Спробуйте пізніше або скористайтеся кнопками швидкого зв\'язку.');
        });
    });
</script>

</body>
</html>
