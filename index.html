<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квитки на автобус з України до Європи</title>
    <!-- Підключення сучасних іконок Font Awesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-image: url('bg.jpg'); 
            background-size: contain; 
            background-position: center top; 
            background-repeat: repeat; 
            background-attachment: fixed; 
            background-color: #0f2b5c; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Напівпрозорий блок-контейнер поверх фону */
        .main-card {
            background: rgba(22, 58, 117, 0.94); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 2px solid rgba(35, 82, 155, 0.6);
            text-align: center;
        }
        
        /* Стилі форми пошуку */
        .search-form {
            background: rgba(13, 36, 77, 0.85);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px solid #1e4b91;
            text-align: left;
        }
        .form-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #ffd43b;
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group:last-of-type {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 0.9rem;
            color: #a0b2cb;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #23529b;
            background-color: #163a75;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .input-group input:focus {
            border-color: #ffd43b;
        }

        /* Кнопки месенджерів */
        .cta-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: 600;
            color: #ffffff;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: bold;
            color: white;
            transition: transform 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-submit {
            background: linear-gradient(135deg, #ffd43b, #e5be2b);
            color: #0f2b5c;
            margin-bottom: 0;
        }
        .btn-tg {
            background: linear-gradient(135deg, #26a5e4, #1d8fd1);
            box-shadow: 0 4px 15px rgba(38, 165, 228, 0.2);
        }
        .btn-viber {
            background: linear-gradient(135deg, #7360f2, #5945d6);
            box-shadow: 0 4px 15px rgba(115, 96, 242, 0.2);
        }
        .btn-phone {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.2);
            margin-bottom: 0;
        }
        
        .footer {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #a0b2cb;
        }
    </style>
</head>
<body>

<div class="main-card">
    
    <!-- Блок з полями введення -->
    <div class="search-form">
        <div class="form-title">Швидкий підбір рейсу</div>
        
        <div class="input-group">
            <label for="from">Місто відправлення (Україна):</label>
            <input type="text" id="from" placeholder="Наприклад: Київ, Львів" list="ukraine-cities">
            <datalist id="ukraine-cities">
                <option value="Київ">
                <option value="Львів">
                <option value="Одеса">
                <option value="Дніпро">
                <option value="Харків">
                <option value="Запоріжжя">
                <option value="Івано-Франківськ">
                <option value="Тернопіль">
                <option value="Чернівці">
                <option value="Вінниця">
                <option value="Луцьк">
                <option value="Рівне">
                <option value="Житомир">
                <option value="Полтава">
                <option value="Хмельницький">
            </datalist>
        </div>
        
        <div class="input-group">
            <label for="to">Місто прибуття (Європа):</label>
            <input type="text" id="to" placeholder="Наприклад: Варшава, Берлін" list="europe-cities">
            <datalist id="europe-cities">
                <option value="Варшава (Польща)">
                <option value="Краків (Польща)">
                <option value="Вроцлав (Польща)">
                <option value="Берлін (Німеччина)">
                <option value="Мюнхен (Німеччина)">
                <option value="Прага (Чехія)">
                <option value="Брно (Чехія)">
                <option value="Будапешт (Угорщина)">
                <option value="Відень (Австрія)">
                <option value="Братислава (Словаччина)">
                <option value="Вільнюс (Литва)">
                <option value="Рига (Латвія)">
                <option value="Париж (Франція)">
                <option value="Рим (Італія)">
            </datalist>
        </div>
        
        <div class="input-group">
            <label for="date">Дата поїздки:</label>
            <input type="text" id="date" placeholder="Оберіть або введіть дату" onfocus="(this.type='date')" onblur="(this.value ? this.type='date' : this.type='text')">
        </div>

        <div class="input-group">
            <label for="phone">Ваш номер телефону:</label>
            <input type="tel" id="phone" placeholder="+380" value="+380">
        </div>
        
        <!-- Головна жовта кнопка -->
        <button type="button" id="mainActionBtn" class="btn btn-submit">
            <span>Надіслати заявку в Telegram</span>
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>

    <div class="cta-title">Або надішліть заповнені дані в особисті:</div>
    
    <button type="button" id="tgPersonalBtn" class="btn btn-tg">
        <i class="fa-brands fa-telegram" style="font-size: 1.3rem;"></i>
        <span>Надіслати в особистий Telegram</span>
    </button>

    <button type="button" id="viberPersonalBtn" class="btn btn-viber">
        <i class="fa-brands fa-viber" style="font-size: 1.3rem;"></i>
        <span>Надіслати в особистий Viber</span>
    </button>

    <a href="tel:+380995674703" class="btn btn-phone">
        <i class="fa-solid fa-phone"></i>
        <span>Зателефонувати: 099 567 47 03</span>
    </a>

    <div class="footer">
        Бронювання безкоштовне • Оплата при посадці
    </div>
</div>

<script>
    function buildMessage() {
        const fromCity = document.getElementById('from').value.trim() || 'Не вказано';
        const toCity = document.getElementById('to').value.trim() || 'Не вказано';
        const rawDate = document.getElementById('date').value || 'Не вказано';
        const clientPhone = document.getElementById('phone').value.trim() || 'Не вказано';

        return `Вітаю! Бажаю залишити заявку на підбір рейсу:\n• Звідки: ${fromCity}\n• Куди: ${toCity}\n• Дата: ${rawDate}\n• Мій телефон: ${clientPhone}`;
    }

    // Головна жовта кнопка
    document.getElementById('mainActionBtn').addEventListener('click', function() {
        window.open('https://t.me' + encodeURIComponent(buildMessage()), '_blank');
    });

    // Синя кнопка Telegram
    document.getElementById('tgPersonalBtn').addEventListener('click', function() {
        window.open('https://t.me' + encodeURIComponent(buildMessage()), '_blank');
    });

    // Фіолетова кнопка Viber
    document.getElementById('viberPersonalBtn').addEventListener('click', function() {
        window.location.href = 'viber://chat?number=%2B380995674703&draft=' + encodeURIComponent(buildMessage());
    });
</script>

</body>
</html>
