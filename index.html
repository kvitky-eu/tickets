<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квитки на автобус з України до Європи</title>
    <!-- Підключення сучасних іконок Font Awesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-image: url('bg.jpg'); 
            background-size: contain; 
            background-position: center top; 
            background-repeat: repeat; 
            background-attachment: fixed; 
            background-color: #0f2b5c; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Напівпрозорий блок-контейнер поверх фону */
        .main-card {
            background: rgba(22, 58, 117, 0.94); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 2px solid rgba(35, 82, 155, 0.6);
            text-align: center;
        }

        .main-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffd43b;
            margin-bottom: 10px;
        }

        .main-subtitle {
            font-size: 1rem;
            color: #ffffff;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        
        .cta-title {
            font-size: 1.1rem;
            margin-bottom: 20px;
            font-weight: 600;
            color: #ffffff;
        }

        /* Стилі кнопок швидкого зв'язку */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            transition: transform 0.1s;
            border: none;
            cursor: pointer;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-tg {
            background: linear-gradient(135deg, #26a5e4, #1d8fd1);
            box-shadow: 0 4px 15px rgba(38, 165, 228, 0.2);
        }
        .btn-viber {
            background: linear-gradient(135deg, #7360f2, #5945d6);
            box-shadow: 0 4px 15px rgba(115, 96, 242, 0.2);
        }
        .btn-phone {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.2);
            margin-bottom: 0;
        }
        
        .footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #a0b2cb;
        }
    </style>
</head>
<body>

<div class="main-card">
    
    <div class="main-title">Квитки на автобус</div>
    <div class="main-subtitle">Комфортні та надійні пасажирські перевезення з України до Європи. Підберемо найкращий маршрут та дату!</div>

    <div class="cta-title">Натисніть на месенджер для швидкого замовлення:</div>
    
    <!-- Кнопка Telegram -->
    <a href="https://t.me." target="_blank" class="btn btn-tg">
        <i class="fa-brands fa-telegram" style="font-size: 1.4rem;"></i>
        <span>Замовити через Telegram</span>
    </a>

    <!-- Кнопка Viber -->
    <a href="viber://chat?number=%2B380995674703&draft=%D0%92%D1%96%D1%82%D0%B0%D1%8E%21+%D0%9C%D0%B5%D0%BD%D0%B5+%D1%96%D0%BD%D1%82%D0%B5%D1%80%D0%B5%D1%81%D1%83%D1%8E%D1%82%D1%8C+%D0%BA%D0%B2%D0%B8%D1%82%D0%BE%D0%BA+%D0%BD%D0%B0+%D0%B0%D0%B2%D1%82%D0%BE%D0%B1%D1%83%D1%81." class="btn btn-viber">
        <i class="fa-brands fa-viber" style="font-size: 1.4rem;"></i>
        <span>Замовити через Viber</span>
    </a>

    <!-- Кнопка прямого дзвінка -->
    <a href="tel:+380995674703" class="btn btn-phone">
        <i class="fa-solid fa-phone"></i>
        <span>Зателефонувати: 099 567 47 03</span>
    </a>

    <div class="footer">
        Бронювання безкоштовне • Оплата при посадці
    </div>
</div>

</body>
</html>
